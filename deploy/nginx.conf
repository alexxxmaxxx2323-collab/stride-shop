# nginx reverse-proxy для Stride Shop. Замени stride-shop.ru на свой домен.
#
# Установка:
#   sudo cp /opt/stride-shop/deploy/nginx.conf /etc/nginx/sites-available/stride
#   sudo ln -s /etc/nginx/sites-available/stride /etc/nginx/sites-enabled/stride
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d stride-shop.ru -d www.stride-shop.ru   # выпустит HTTPS,
#                                                                  # сам допишет блок listen 443 + редирект с 80
server {
    listen 80;
    server_name stride-shop.ru www.stride-shop.ru;

    # Админка грузит фото товаров — поднимаем лимит тела запроса.
    client_max_body_size 12M;

    # Всё (API + статика + webhook бота) проксируем в uvicorn на localhost:8077.
    location / {
        proxy_pass http://127.0.0.1:8077;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # (опц.) Отдавать статику напрямую nginx — быстрее, но не обязательно для портфолио:
    # location /static/ {
    #     alias /opt/stride-shop/backend/static/;
    #     expires 1h;
    # }
}
