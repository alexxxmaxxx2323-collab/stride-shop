<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>STRIDE</title>
  <!-- Мостик Telegram: даёт window.Telegram.WebApp (тема, кнопки, данные юзера) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Единые с сайтом шрифты: Space Grotesk (заголовки) + Inter (текст) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Leaflet: открытая карта для выбора пункта выдачи (без API-ключей) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <link rel="stylesheet" href="styles.css?v=10">
</head>
<body>
  <!-- Шапка -->
  <header class="tg-header">
    <button class="tg-back" id="backBtn" hidden aria-label="Назад">‹</button>
    <div class="tg-logo">STRIDE</div>
    <button class="tg-iconbtn" id="favBtn" aria-label="Избранное">
      <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      <span class="tg-dot" id="favIndN" hidden></span>
    </button>
    <button class="tg-iconbtn" id="profileBtn" aria-label="Профиль">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
    </button>
    <button class="tg-iconbtn" id="cartBtn" aria-label="Корзина">
      <svg viewBox="0 0 24 24"><path d="M6 6h15l-1.5 9h-13z"/><path d="M6 6 5 3H2"/><circle cx="8.5" cy="20" r="1.3"/><circle cx="18.5" cy="20" r="1.3"/></svg>
      <span class="tg-cart-badge" id="cartIndN" hidden>0</span>
    </button>
  </header>

  <!-- Экран: каталог -->
  <section id="viewCatalog" class="view">
    <div class="tg-search">
      <input id="searchInput" type="search" inputmode="search" placeholder="Поиск: модель или бренд">
    </div>
    <div class="tg-chips" id="chips"></div>
    <div class="tg-meta" id="meta"></div>
    <div class="tg-grid" id="grid"></div>
  </section>

  <!-- Экран: товар -->
  <section id="viewProduct" class="view" hidden></section>

  <!-- Экран: избранное -->
  <section id="viewFavorites" class="view" hidden></section>

  <!-- Экран: профиль (заказы + бонусы + поддержка) -->
  <section id="viewProfile" class="view" hidden></section>

  <!-- Экран: корзина -->
  <section id="viewCart" class="view" hidden></section>

  <!-- Экран: оформление -->
  <section id="viewCheckout" class="view" hidden></section>

  <!-- Экран: оплата -->
  <section id="viewPayment" class="view" hidden></section>

  <!-- Экран: успех -->
  <section id="viewSuccess" class="view" hidden></section>

  <!-- Всплывающая подсказка -->
  <div class="tg-toast" id="toast" hidden></div>

  <script src="app.js?v=10"></script>
</body>
</html>
